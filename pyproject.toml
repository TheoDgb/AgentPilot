[project]
name = "agentpilot"
version = "0.1.0"
description = "Plateforme expérimentale de déploiement, supervision et évaluation d'agents IA sur la boutique simulée ShopSim"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # Métriques Prometheus (ShopSim et AgentPilot) : compteurs, histogrammes, format d'exposition
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # TestClient de FastAPI
    "httpx>=0.27",
    # Lecture des règles d'alerte et de leurs tests (déjà installé par uvicorn[standard])
    "pyyaml>=6.0",
]
# Serveur MCP (SDK officiel) et son client HTTP vers ShopSim ; absent de l'image ShopSim
mcp = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]
# Claude Agent SDK (embarque le binaire Claude Code) pour le service AgentPilot
agent = [
    "claude-agent-sdk>=0.2.174,<0.3",
    # Page d'approbation : gabarits HTML à échappement automatique (contenu des tickets non
    # fiable) et lecture des formulaires par FastAPI
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["observability", "shopsim", "mcp_server", "agentpilot", "traffic"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shopsim*", "mcp_server*", "agentpilot*", "evals*", "observability*", "traffic*"]

[tool.setuptools.package-data]
agentpilot = ["templates/*.html"]