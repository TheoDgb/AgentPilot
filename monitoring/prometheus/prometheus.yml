# Collecte des métriques de ShopSim et d'AgentPilot (J4.2).
#
# Réseau Docker (docker-compose.yml, J7.1) : ShopSim (`app`) et AgentPilot (`agentpilot`) par le
# nom de leur service. AgentPilot arrêté (évaluation, service local) : up{job="agentpilot"} = 0.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

# Règles d'alerte (J4.4), envoyées à Alertmanager (service `alertmanager`)
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: shopsim
    static_configs:
      - targets: ["app:8000"]
  - job_name: agentpilot
    static_configs:
      - targets: ["agentpilot:8001"]
