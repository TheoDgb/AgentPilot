# Tests (J5.4) : ruff puis pytest, à chaque push et pull request.
# Aucun secret, aucun appel réel à Claude : les tests de l'agent utilisent un faux SDK.
# Jamais `pull_request_target` : une pull request venant d'un fork tourne sans aucun accès.
# Actions épinglées par SHA de commit complet (un tag peut être déplacé), version en commentaire.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Base de test des fixtures (`TEST_DATABASE_URL` par défaut : localhost:5433/shopsim_test)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopsim
          POSTGRES_PASSWORD: shopsim
          POSTGRES_DB: shopsim_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shopsim -d shopsim_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Dépendances
        run: |
          uv venv
          uv pip install -e ".[dev,mcp,agent]"

      - name: Lint (ruff check)
        run: .venv/bin/ruff check .

      - name: Formatage (ruff format)
        run: .venv/bin/ruff format --check .

      # Images des tests des règles d'alerte (promtool, amtool), fixées dans docker-compose.yml :
      # téléchargées avant pytest pour que les tests gardent leur marge de temps
      - name: Images de Prometheus et d'Alertmanager
        run: |
          grep -oE 'prom/(prometheus|alertmanager):[^[:space:]]+' docker-compose.yml \
            | sort -u | xargs -n1 docker pull --quiet

      - name: pytest
        run: .venv/bin/python -m pytest
