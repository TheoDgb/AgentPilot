services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopsim}
      POSTGRES_DB: ${POSTGRES_DB:-shopsim}
    # Publié sur l'hôte seulement, pas sur le réseau local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      dockerfile: shopsim/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shopsim}:${POSTGRES_PASSWORD:-shopsim}@db:5432/${POSTGRES_DB:-shopsim}
      PAYMENT_LATENCY_MS: ${PAYMENT_LATENCY_MS:-100}
      # Jeton des endpoints Chaos ; vide = Chaos fermé
      CHAOS_TOKEN: ${CHAOS_TOKEN:-}
      # 1 = horloge figée au 2026-07-06 12:00 (évaluations) ; sinon elle avance depuis le seed
      SHOPSIM_FREEZE_CLOCK: ${SHOPSIM_FREEZE_CLOCK:-0}
      # Logs JSON : shopsim-<jour>.jsonl (et chaos-<jour>.jsonl pour les requêtes /chaos), à côté de ceux
      # d'AgentPilot et du serveur MCP
      LOG_DIR: /srv/logs
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    # Fichiers de logs à l'utilisateur de l'hôte, pas à root
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./logs:/srv/logs
    # Publié sur l'hôte seulement, pas sur le réseau local
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # L'image slim n'a pas curl : on passe par Python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Générateur de trafic (J4.3) : profil séparé, ne démarre pas avec le reste.
  #   docker compose --profile traffic up -d traffic     (arrêt : docker compose stop traffic)
  # Création de tickets désactivée par défaut : chaque ticket est traité par l'agent et coûte.
  traffic:
    profiles: ["traffic"]
    build:
      context: .
      dockerfile: shopsim/Dockerfile
    command: ["python", "-m", "traffic"]
    environment:
      SHOPSIM_URL: http://app:8000
      TRAFFIC_RPS: ${TRAFFIC_RPS:-5}
      TRAFFIC_TICKETS_PER_HOUR: ${TRAFFIC_TICKETS_PER_HOUR:-0}
      TRAFFIC_MAX_TICKETS: ${TRAFFIC_MAX_TICKETS:-}
      LOG_DIR: /srv/logs
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./logs:/srv/logs
    depends_on:
      app:
        condition: service_healthy

  # AgentPilot (J7.1) : service, boucle de l'agent Support, enquêtes de l'agent Ops, pages.
  # Démarre en pause et enquête automatique coupée (AGENTPILOT_PAUSE_ON_START) : `up` ne dépense
  # rien. Environnement champ par champ, jamais `env_file` : `.env` contient CHAOS_TOKEN, qui
  # n'entre jamais dans ce conteneur (un test le vérifie). La clé d'API vient de `.env` par
  # l'interpolation de Compose, dans l'environnement du conteneur seulement.
  agentpilot:
    build:
      context: .
      dockerfile: agentpilot/Dockerfile
    environment:
      AGENTPILOT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shopsim}:${POSTGRES_PASSWORD:-shopsim}@db:5432/${POSTGRES_DB:-shopsim}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTPILOT_LOG_DIR: /srv/logs
      AGENTPILOT_DAILY_BUDGET_USD: ${AGENTPILOT_DAILY_BUDGET_USD:-5}
      AGENTPILOT_OPS_ARCHITECTURE: ${AGENTPILOT_OPS_ARCHITECTURE:-solo}
      AGENTPILOT_OPS_MAX_PER_HOUR: ${AGENTPILOT_OPS_MAX_PER_HOUR:-6}
      AGENTPILOT_PAUSE_ON_START: ${AGENTPILOT_PAUSE_ON_START:-1}
      # Canal Discord (J7.2) : secret, vide par défaut ; retiré de l'environnement du service au
      # démarrage (jamais vu par la CLI de l'agent ni par les serveurs MCP)
      AGENTPILOT_DISCORD_WEBHOOK_URL: ${AGENTPILOT_DISCORD_WEBHOOK_URL:-}
      AGENTPILOT_NOTIFY_MAX_PER_HOUR: ${AGENTPILOT_NOTIFY_MAX_PER_HOUR:-10}
      AGENTPILOT_PUBLIC_URL: ${AGENTPILOT_PUBLIC_URL:-http://localhost:8001}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      # Sources des agents (serveurs MCP lancés dans ce conteneur), par le réseau Docker
      SHOPSIM_URL: http://app:8000
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
      AGENTPILOT_URL: http://localhost:8001
    # Fichiers de logs à l'utilisateur de l'hôte, pas à root
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./logs:/srv/logs
    # Publié sur l'hôte seulement, pas sur le réseau local
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/control/status')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Supervision (J4.2), sur le réseau Docker (J7.1) : Prometheus collecte `app` et `agentpilot`
  # par leur nom, Alertmanager envoie à `agentpilot`, Grafana lit `prometheus`. Ports publiés
  # sur 127.0.0.1 seulement.
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # Configuration, règles d'alerte et leurs tests
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  # Alertes (J4.4) : reçues de Prometheus, envoyées à AgentPilot (POST /alerts/webhook), et au
  # canal Discord si son adresse est dans `.env` (J7.2) : start.sh choisit la configuration
  alertmanager:
    image: prom/alertmanager:v0.34.1
    entrypoint: ["/bin/sh", "/etc/alertmanager/start.sh"]
    command:
      - --storage.path=/alertmanager
      # Pas de mode haute disponibilité : il ouvrirait le port 9094
      - --cluster.listen-address=
    environment:
      # Secret, vide par défaut (pas de canal) ; jamais écrit dans le dépôt
      AGENTPILOT_DISCORD_WEBHOOK_URL: ${AGENTPILOT_DISCORD_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      # Les deux configurations (sans et avec Discord) et le script de démarrage
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Lecture du tableau de bord sans compte ; l'administration reste derrière le mot de passe
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/agentpilot.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    # Tout vient des fichiers du dépôt : source de données et tableau de bord provisionnés,
    # pas de volume de données
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus-data:
  alertmanager-data: